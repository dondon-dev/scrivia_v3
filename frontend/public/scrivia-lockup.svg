<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 160" fill="none">
  <defs>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFD5"/>
      <stop offset="35%" stop-color="#00BFFF"/>
      <stop offset="70%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#0000FF"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00BFFF"/>
      <stop offset="1" stop-color="#0080FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.9" stdDeviation="2.4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon mark (official artwork: gradient S, white pen nib, three NE pixels) -->
  <g transform="translate(0 0) scale(1.9)">
    <path d="M42.5 13.75C36.25 7.5 21.25 7.5 16.25 16.25C11.875 23.75 17.5 30.625 28.125 32.5C40 34.75 44.375 38.125 44.375 43.75C44.375 50.625 37.5 54.375 28.75 54.375C21.875 54.375 16.25 51.875 11.875 47.5" stroke="url(#mark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
    <g transform="translate(32 32)">
      <path d="M0 -5L4.375 0L0 8.125L-4.375 0Z" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="0" cy="1.5" r="1" fill="#00BFFF"/>
    </g>
    <rect x="46.25" y="14.375" width="2.25" height="2.25" rx="0.375" fill="#00FFD5"/>
    <rect x="49.375" y="11.875" width="1.75" height="1.75" rx="0.25" fill="#00BFFF"/>
    <rect x="51.875" y="9.375" width="1.25" height="1.25" rx="0.25" fill="#0080FF"/>
  </g>

  <!-- Wordmark -->
  <text x="0" y="128" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" letter-spacing="4" fill="#102A43">SCRIVIA<tspan font-size="12" fill="#0080FF" dy="-9">™</tspan></text>
  <line x1="0" y1="142" x2="52" y2="142" stroke="#00BFFF" stroke-width="2"/>
  <text x="60" y="146" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="url(#cloud)">CLOUD</text>
  <line x1="150" y1="142" x2="202" y2="142" stroke="#0080FF" stroke-width="2"/>
  <text x="0" y="158" font-family="Arial,Helvetica,sans-serif" font-size="8.5" letter-spacing="2.6" fill="#64748B">SMART PAYROLL. SECURE FUTURE.</text>
</svg>
