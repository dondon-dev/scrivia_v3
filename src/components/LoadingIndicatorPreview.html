<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Indicator Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #ffffff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  .variant {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 40px 60px;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    background: #fafafa;
  }
  .variant-label {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .indicator {
    position: relative;
  }
  .bloom {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    animation: bloomPulse 1.4s ease-in-out infinite;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    animation: dotRadial 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
  }

  @keyframes dotRadial {
    0%, 100% {
      transform: translate(0, 0) scale(0.35);
      opacity: 0.25;
    }
    50% {
      transform: translate(var(--tx), var(--ty)) scale(1);
      opacity: 1;
    }
  }
  @keyframes bloomPulse {
    0%, 100% {
      transform: scale(0.6);
      opacity: 0.08;
    }
    50% {
      transform: scale(1.1);
      opacity: 0.18;
    }
  }
  .label {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Small -->
  <div class="variant">
    <span class="variant-label">Small · 40px</span>
    <div class="indicator" id="small"></div>
    <span class="label" style="color: #078A8C;">Processing…</span>
  </div>

  <!-- Medium -->
  <div class="variant">
    <span class="variant-label">Medium · 56px</span>
    <div class="indicator" id="medium"></div>
    <span class="label" style="color: #078A8C;">Syncing payroll data…</span>
  </div>

  <!-- Large -->
  <div class="variant">
    <span class="variant-label">Large · 80px</span>
    <div class="indicator" id="large"></div>
    <span class="label" style="color: #078A8C;">Computing deductions…</span>
  </div>
</div>

<script>
const COLOR = '#078A8C';
const POSITIONS = [
  { x: 0, y: -1 },  // top
  { x: 1, y: 0 },   // right
  { x: 0, y: 1 },   // bottom
  { x: -1, y: 0 },  // left
];

function createIndicator(id, size) {
  const container = document.getElementById(id);
  const dotSize = size * 0.16;
  const radius = size * 0.34;

  container.style.width = size + 'px';
  container.style.height = size + 'px';

  // Bloom
  const bloom = document.createElement('div');
  bloom.className = 'bloom';
  bloom.style.backgroundColor = COLOR;
  bloom.style.filter = `blur(${size * 0.3}px)`;
  bloom.style.opacity = '0.12';
  container.appendChild(bloom);

  // Dots
  POSITIONS.forEach((pos, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.width = dotSize + 'px';
    dot.style.height = dotSize + 'px';
    dot.style.backgroundColor = COLOR;
    dot.style.top = '50%';
    dot.style.left = '50%';
    dot.style.marginTop = (-dotSize / 2) + 'px';
    dot.style.marginLeft = (-dotSize / 2) + 'px';
    dot.style.boxShadow = `0 0 ${dotSize * 0.8}px ${COLOR}40`;
    dot.style.setProperty('--tx', (pos.x * radius) + 'px');
    dot.style.setProperty('--ty', (pos.y * radius) + 'px');
    dot.style.animationDelay = (i * 0.15) + 's';
    container.appendChild(dot);
  });
}

createIndicator('small', 40);
createIndicator('medium', 56);
createIndicator('large', 80);
</script>
</body>
</html>
